# XcodeGen spec. The .xcodeproj and Sources/Info.plist are generated by `xcodegen generate` on the macOS runner and are
# not checked in. This file also goes into the public build copy (scripts/publish-public.sh): nothing personal here
# beyond the bundle id, which the signer needs.
name: GupMail
options:
  bundleIdPrefix: com.dltnp
  deploymentTarget:
    iOS: "16.0"
targets:
  GupMail:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      # the web UI's build output (repo-root mobile/dist/, committed), copied in as a folder so the app bundle keeps
      # dist/index.html and its subfolders
      - path: ../mobile/dist
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: GupMail
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBG
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # gupmail://open?thread=<id> (a notification's tap): navigation only, after unlock; handled in a later slice
        CFBundleURLTypes:
          - CFBundleURLName: com.dltnp.gupmail
            CFBundleURLSchemes: [gupmail]
        UIUserInterfaceStyle: Dark
        CADisableMinimumFrameDurationOnPhone: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dltnp.gupmail
        PRODUCT_NAME: GupMail
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
